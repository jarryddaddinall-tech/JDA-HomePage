<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Writing by Jarryd Addinall — Substack newsletter and site notes." />
    <title>Writing · Jarryd Addinall</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="header" id="site-header"></header>
    <script src="site-header.js"></script>

    <main id="main" class="main main--writing">
      <header class="page-head stack stack-tight">
        <h1>Writing</h1>
        <p class="writing-intro">Essays on Substack; shorter notes and pages from this site follow.</p>
      </header>

      <!-- Publication URL + embed: writing-config.js -->
      <section class="writing-substack" aria-labelledby="substack-heading">
        <p class="writing-substack-kicker">Substack · newsletter</p>
        <h2 id="substack-heading" class="writing-substack-heading">
          <a
            id="writing-substack-link"
            class="writing-substack-heading-link"
            href="https://jarrydaddinall.substack.com"
            target="_blank"
            rel="noopener noreferrer"
            >Insights And Rhythms</a
          >
        </h2>
        <div class="writing-embed-shell">
          <iframe
            id="writing-substack-embed"
            src="https://jarrydaddinall.substack.com/embed"
            title="Subscribe to Insights And Rhythms on Substack"
            loading="lazy"
            width="680"
            height="420"
          ></iframe>
        </div>
      </section>

      <ul class="post-list" role="list">
        <li>
          <article class="post-row">
            <a class="post-link" href="writing/hello-world.html">
              <span class="post-title">Starting this corner of the internet</span>
              <span class="post-desc">Placeholder article. Replace with your own.</span>
            </a>
            <time class="post-date" datetime="2025-03-19">19 Mar 2025</time>
          </article>
        </li>
      </ul>
    </main>

    <footer class="footer"></footer>
    <script src="writing-config.js"></script>
    <script src="writing-page.js"></script>
  </body>
</html>
